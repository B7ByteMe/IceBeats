name: Build Android APK & Release

on:
  push:
    branches: [ "main", "master" ]
    tags:
      - 'v*'
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Setup google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            echo "Memulihkan google-services.json dari GitHub Secrets..."
            echo "$GOOGLE_SERVICES_JSON" > app/google-services.json
          elif [ -f "app/google-services.json" ]; then
            echo "Menggunakan app/google-services.json yang ada di repositori."
          else
            echo "::warning::File app/google-services.json tidak ditemukan dan Secret GOOGLE_SERVICES_JSON kosong."
          fi

      - name: Setup Signing Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Memulihkan debug.keystore dari GitHub Secrets..."
            mkdir -p ~/.android
            echo "$KEYSTORE_BASE64" | base64 -d > ~/.android/debug.keystore
            echo "$KEYSTORE_BASE64" | base64 -d > app/debug.keystore
          else
            echo "Menggunakan keystore bawaan GitHub runner."
          fi

      - name: Build Release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Prepare and Name APKs for Release
        run: |
          mkdir -p release-apks
          for file in app/build/outputs/apk/release/*.apk; do
            filename=$(basename "$file")
            if [[ "$filename" == *"universal"* ]]; then
              cp "$file" "release-apks/IceBeats-v7.1.3-universal.apk"
              cp "$file" "release-apks/IceBeats-v7.1.3.apk"
            elif [[ "$filename" == *"arm64-v8a"* ]]; then
              cp "$file" "release-apks/IceBeats-v7.1.3-arm64-v8a.apk"
            elif [[ "$filename" == *"armeabi-v7a"* ]]; then
              cp "$file" "release-apks/IceBeats-v7.1.3-armeabi-v7a.apk"
            elif [[ "$filename" == *"x86_64"* ]]; then
              cp "$file" "release-apks/IceBeats-v7.1.3-x86_64.apk"
            else
              cp "$file" "release-apks/$filename"
            fi
          done
          echo "Daftar APK yang siap dirilis:"
          ls -la release-apks/

      - name: Upload All APK Variants
        uses: actions/upload-artifact@v4
        with:
          name: IceBeats-v7.1.3-Multi-Arch-APKs
          path: release-apks/*.apk
          retention-days: 14

      - name: Publish to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'v7.1.4' }}
          name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'IceBeats v7.1.4' }}
          body: |
            ## 🎵 IceBeats v7.1.4

            ### ✨ Fitur Baru & Peningkatan di v7.1.4:
            - **👑 Border Home Chat Rapi & Proporsional**: Ukuran avatar dan border khusus di halaman daftar obrolan (Home Chat) diperkecil secara seimbang (`34.dp` dalam container `54.dp`) sehingga animasi border tidak lagi menabrak tepi card atau menutupi teks nama, tetap mulus dan presisi tanpa celah.
            - **👆 Menu Tekan Lama (Long Press) Obrolan**: Tekan lama pada salah satu obrolan untuk membuka menu aksi cepat:
              - **Lihat Profil**: Menampilkan profil lengkap, status tier, jam didengarkan, dan playlist.
              - **Hapus Pertemanan**: Menghapus status pertemanan dengan akun tersebut secara instan.
              - **Hapus Obrolan**: Menghapus seluruh riwayat pesan percakapan secara permanen.
            - **🕒 Jam & Status Pesan WhatsApp Style**: Penunjuk waktu jam:menit dan centang status terkirim/dibaca di setiap bubble pesan.
            - **👥 Sistem Pertemanan Terintegrasi**: Tab Obrolan dan Tab Teman & Permintaan untuk mengelola relasi pertemanan.
            - **📱 Multi-Architecture Support**:
              - `IceBeats-v7.1.4.apk` & `IceBeats-v7.1.4-universal.apk`: Universal untuk semua HP Android.
              - `IceBeats-v7.1.4-arm64-v8a.apk`: Khusus HP 64-bit modern.
              - `IceBeats-v7.1.4-armeabi-v7a.apk`: Khusus HP 32-bit.
              - `IceBeats-v7.1.4-x86_64.apk`: Untuk Emulator Android PC.
          files: release-apks/*.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
