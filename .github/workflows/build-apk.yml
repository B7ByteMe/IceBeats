name: Build Android APK & Release

on:
  push:
    branches: [ "main", "master" ]
    tags:
      - 'v*'
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Setup google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            echo "Memulihkan google-services.json dari GitHub Secrets..."
            echo "$GOOGLE_SERVICES_JSON" > app/google-services.json
          elif [ -f "app/google-services.json" ]; then
            echo "Menggunakan app/google-services.json yang ada di repositori."
          else
            echo "::warning::File app/google-services.json tidak ditemukan dan Secret GOOGLE_SERVICES_JSON kosong."
          fi

      - name: Setup Signing Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Memulihkan debug.keystore dari GitHub Secrets..."
            mkdir -p ~/.android
            echo "$KEYSTORE_BASE64" | base64 -d > ~/.android/debug.keystore
            echo "$KEYSTORE_BASE64" | base64 -d > app/debug.keystore
          else
            echo "Menggunakan keystore bawaan GitHub runner."
          fi

      - name: Build Release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Prepare and Name APKs for Release
        run: |
          mkdir -p release-apks
          for file in app/build/outputs/apk/release/*.apk; do
            filename=$(basename "$file")
            if [[ "$filename" == *"universal"* ]]; then
              cp "$file" "release-apks/IceBeats-v7.1.1-universal.apk"
              cp "$file" "release-apks/IceBeats-v7.1.1.apk"
            elif [[ "$filename" == *"arm64-v8a"* ]]; then
              cp "$file" "release-apks/IceBeats-v7.1.1-arm64-v8a.apk"
            elif [[ "$filename" == *"armeabi-v7a"* ]]; then
              cp "$file" "release-apks/IceBeats-v7.1.1-armeabi-v7a.apk"
            elif [[ "$filename" == *"x86_64"* ]]; then
              cp "$file" "release-apks/IceBeats-v7.1.1-x86_64.apk"
            else
              cp "$file" "release-apks/$filename"
            fi
          done
          echo "Daftar APK yang siap dirilis:"
          ls -la release-apks/

      - name: Upload All APK Variants
        uses: actions/upload-artifact@v4
        with:
          name: IceBeats-v7.1.1-Multi-Arch-APKs
          path: release-apks/*.apk
          retention-days: 14

      - name: Publish to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'v7.1.1' }}
          name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'IceBeats v7.1.1' }}
          body: |
            ## 🎵 IceBeats v7.1.1

            ### ✨ Apa yang baru di v7.1.1:
            - **👑 Presisi Border Profil Master**: Ukuran ornamen border diperbesar proporsional agar foto profil/avatar berada pas di tengah cincin mahkota/api, serta penguncian ketat untuk akun non-Master (150 jam).
            - **💬 Miniplayer Auto-Hide di Menu Chat**: UI balok musik otomatis disembunyikan di menu obrolan agar tampilan obrolan penuh dan bersih, sementara lagu tetap berputar di latar belakang tanpa terputus.
            - **👤 Isolasi Data & Level Per-Akun**: Setiap akun memiliki penyimpanan rekor statistik masing-masing. Level dan jam dengar akun lain tidak akan tertukar atau terbawa saat logout dan login akun berbeda.
            - **🔒 Fix Duplikasi Akun & Token Auth**: Tidak ada lagi akun ganda setelah logout & login ulang dengan akun yang sama.
            - **📱 Multi-Architecture Support**:
              - `IceBeats-v7.1.1.apk` & `IceBeats-v7.1.1-universal.apk`: Universal untuk semua HP Android.
              - `IceBeats-v7.1.1-arm64-v8a.apk`: Khusus HP 64-bit modern (performa maksimal).
              - `IceBeats-v7.1.1-armeabi-v7a.apk`: Khusus HP 32-bit.
              - `IceBeats-v7.1.1-x86_64.apk`: Untuk Emulator Android PC.
            - **🛡️ Leaderboard Highscore Protection**: Jam dengar tidak akan pernah berkurang atau reset.
          files: release-apks/*.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
