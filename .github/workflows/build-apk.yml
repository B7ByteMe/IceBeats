name: Build Android APK & Release

on:
  push:
    branches: [ "main", "master" ]
    tags:
      - 'v*'
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Setup google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            echo "Memulihkan google-services.json dari GitHub Secrets..."
            echo "$GOOGLE_SERVICES_JSON" > app/google-services.json
          elif [ -f "app/google-services.json" ]; then
            echo "Menggunakan app/google-services.json yang ada di repositori."
          else
            echo "::warning::File app/google-services.json tidak ditemukan dan Secret GOOGLE_SERVICES_JSON kosong."
          fi

      - name: Setup Signing Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Memulihkan debug.keystore dari GitHub Secrets..."
            mkdir -p ~/.android
            echo "$KEYSTORE_BASE64" | base64 -d > ~/.android/debug.keystore
            echo "$KEYSTORE_BASE64" | base64 -d > app/debug.keystore
          else
            echo "Menggunakan keystore bawaan GitHub runner."
          fi

      - name: Extract App Version
        id: get_version
        run: |
          VERSION_NAME=$(grep "versionName =" app/build.gradle.kts | awk -F '"' '{print $2}')
          echo "VERSION_NAME=$VERSION_NAME" >> $GITHUB_ENV
          echo "VERSION_TAG=v$VERSION_NAME" >> $GITHUB_ENV
          echo "App version: $VERSION_NAME"

      - name: Compile Release Kotlin
        run: |
          set -o pipefail
          ./gradlew :app:compileReleaseKotlin --console=plain 2>&1 | tee compile.log || {
            echo "=== KOTLIN COMPILE ERRORS ==="
            grep -E "^(e: |FAILURE:|> Task .* FAILED|\* What went wrong:|Caused by:)" compile.log | head -n 80
            echo "=== TAIL OF COMPILE LOG ==="
            tail -n 60 compile.log
            exit 1
          }

      - name: Build Release APK
        run: |
          set -o pipefail
          ./gradlew :app:assembleRelease --console=plain --stacktrace 2>&1 | tee build.log || {
            echo "=== GRADLE ERRORS ==="
            grep -E "^(e: |FAILURE:|> Task .* FAILED|\* What went wrong:|Caused by:)" build.log | head -n 80
            echo "=== TAIL OF LOG ==="
            tail -n 60 build.log
            exit 1
          }

      - name: Upload Build Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            compile.log
            build.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Prepare and Name APKs for Release
        run: |
          mkdir -p release-apks
          for file in app/build/outputs/apk/release/*.apk; do
            filename=$(basename "$file")
            if [[ "$filename" == *"universal"* ]]; then
              cp "$file" "release-apks/IceBeats-v${VERSION_NAME}-universal.apk"
              cp "$file" "release-apks/IceBeats-v${VERSION_NAME}.apk"
            elif [[ "$filename" == *"arm64-v8a"* ]]; then
              cp "$file" "release-apks/IceBeats-v${VERSION_NAME}-arm64-v8a.apk"
            elif [[ "$filename" == *"armeabi-v7a"* ]]; then
              cp "$file" "release-apks/IceBeats-v${VERSION_NAME}-armeabi-v7a.apk"
            elif [[ "$filename" == *"x86_64"* ]]; then
              cp "$file" "release-apks/IceBeats-v${VERSION_NAME}-x86_64.apk"
            else
              cp "$file" "release-apks/$filename"
            fi
          done
          echo "Daftar APK yang siap dirilis:"
          ls -la release-apks/

      - name: Upload All APK Variants
        uses: actions/upload-artifact@v4
        with:
          name: IceBeats-v${{ env.VERSION_NAME }}-Multi-Arch-APKs
          path: release-apks/*.apk
          retention-days: 14

      - name: Publish to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || env.VERSION_TAG }}
          name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('IceBeats v{0}', env.VERSION_NAME) }}
          body: |
            ## 🎵 IceBeats v${{ env.VERSION_NAME }} - UI Liquid Glass, Tombol Silver & Penyempurnaan Tata Letak

            ### 🚀 Pembaruan di Versi ${{ env.VERSION_NAME }}:
            - **🧊 Tema iOS Liquid Glass & Tombol Silver**:
              - Desain kartu kaca *Liquid Glass* dengan tombol *Metallic Silver* di halaman Login, Daftar, Lupa Password, Verifikasi OTP, Buat Password Baru, dan *Continue as Guest*.
              - Pengamanan tombol kembali di halaman Login utama serta penambahan timer hitung mundur 60 detik dan dialog konfirmasi saat verifikasi OTP pendaftaran.
            - **📱 Perbaikan Ikon Aplikasi & Tata Letak**:
              - Penyesuaian skala *adaptive & legacy icon* agar ukuran ikon launcher aplikasi proporsional dan rapi.
              - Penambahan jarak aman (`12.dp`) antara *Mini Player* dan *Navigation Bar* agar tidak lagi menempel.
            - **🧹 Penyederhanaan Fitur**:
              - Menghapus fitur Border Profil, Avatar Animasi (GIF), Banner Animasi (GIF), dan banner Top Listener di halaman Home agar aplikasi lebih ringan dan fokus pada pemutar musik.

            ### 📱 Multi-Architecture Support:
            - `IceBeats-v${{ env.VERSION_NAME }}.apk` & `IceBeats-v${{ env.VERSION_NAME }}-universal.apk`: Universal untuk semua HP Android.
            - `IceBeats-v${{ env.VERSION_NAME }}-arm64-v8a.apk`: Khusus HP 64-bit modern (rekomendasi).
            - `IceBeats-v${{ env.VERSION_NAME }}-armeabi-v7a.apk`: Khusus HP 32-bit.
            - `IceBeats-v${{ env.VERSION_NAME }}-x86_64.apk`: Untuk Emulator Android PC.
          files: release-apks/*.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
